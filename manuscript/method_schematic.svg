<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .panel{fill:#fbfcfe;stroke:#c7d2e0;stroke-width:1.5;}
      .ptitle{font-size:15px;font-weight:bold;fill:#1a3b5d;}
      .ax{stroke:#999;stroke-width:1;}
      .lab{font-size:11px;fill:#444;}
      .sub{font-size:10px;fill:#666;}
      .teal{stroke:#1b9e77;fill:none;stroke-width:2;}
      .purp{stroke:#7570b3;fill:none;stroke-width:2;}
      .blue{stroke:#2c7fb8;fill:none;stroke-width:2;}
      .orng{stroke:#e6550d;fill:none;stroke-width:2;}
      .exp{stroke-dasharray:5 3;}
      .flow{stroke:#555;stroke-width:2;fill:none;}
      .zero{stroke:#888;stroke-width:1;stroke-dasharray:4 3;}
      .dots{font-size:16px;fill:#888;font-weight:bold;}
    </style>
  </defs>

  <!-- ========================= PANEL A ========================= -->
  <rect class="panel" x="18" y="40" width="1204" height="330" rx="10"/>
  <text class="ptitle" x="34" y="66">A · Model calibration (national level)</text>

  <!-- A1: fertility by age, 2000 vs 2025 (same peak, shifted right) -->
  <text class="sub" x="150" y="88" text-anchor="middle">fertility by age</text>
  <line class="ax" x1="80" y1="195" x2="300" y2="195"/>
  <line class="ax" x1="80" y1="100" x2="80" y2="195"/>
  <path class="blue" d="M83,193 C118,190 133,112 156,112 C179,112 194,190 297,193"/>
  <path class="orng" d="M96,193 C140,190 165,112 188,112 C211,112 226,191 300,194"/>
  <text class="lab" x="190" y="212" text-anchor="middle">age</text>
  <text class="lab" x="66" y="150" text-anchor="middle" transform="rotate(-90 66 150)">fertility</text>
  <line class="blue" x1="235" y1="104" x2="251" y2="104"/><text class="sub" x="255" y="107">2000</text>
  <line class="orng" x1="235" y1="118" x2="251" y2="118"/><text class="sub" x="255" y="121">2025</text>

  <!-- A2: population over time, two ages -->
  <text class="sub" x="150" y="238" text-anchor="middle">population over time (two ages)</text>
  <line class="ax" x1="80" y1="340" x2="300" y2="340"/>
  <line class="ax" x1="80" y1="250" x2="80" y2="340"/>
  <path class="teal" d="M83,298 C150,293 230,289 297,286"/>
  <path class="purp" d="M83,320 C150,317 230,314 297,309"/>
  <line class="teal" x1="235" y1="258" x2="251" y2="258"/><text class="sub" x="255" y="261">Age 15</text>
  <line class="purp" x1="235" y1="272" x2="251" y2="272"/><text class="sub" x="255" y="275">Age 50</text>
  <text class="lab" x="190" y="357" text-anchor="middle">time</text>
  <text class="lab" x="66" y="295" text-anchor="middle" transform="rotate(-90 66 295)">population</text>

  <!-- merge arrows into model -->
  <path class="flow" d="M303,150 C360,160 380,205 430,212" marker-end="url(#arrow)"/>
  <path class="flow" d="M303,295 C360,285 380,228 430,218" marker-end="url(#arrow)"/>
  <rect x="432" y="196" width="96" height="40" rx="6" fill="#eef3f9" stroke="#c7d2e0"/>
  <text class="sub" x="480" y="213" text-anchor="middle">negative-binomial</text>
  <text class="sub" x="480" y="227" text-anchor="middle">model</text>
  <path class="flow" d="M530,216 C545,216 548,216 560,216" marker-end="url(#arrow)"/>

  <!-- A3: births over time, two ages, observed centred on expected -->
  <text class="sub" x="710" y="110" text-anchor="middle">number of births over time (two ages)</text>
  <line class="ax" x1="585" y1="300" x2="855" y2="300"/>
  <line class="ax" x1="585" y1="130" x2="585" y2="300"/>
  <path class="teal exp" d="M588,250 C650,248 720,247 852,247"/>
  <path class="teal"     d="M588,256 C640,242 690,240 740,248 C790,256 825,244 852,249"/>
  <path class="purp exp" d="M588,214 C650,212 720,211 852,211"/>
  <path class="purp"     d="M588,220 C645,206 695,208 745,216 C795,224 825,208 852,213"/>
  <text class="lab" x="720" y="318" text-anchor="middle">time</text>
  <text class="lab" x="571" y="215" text-anchor="middle" transform="rotate(-90 571 215)">births</text>
  <line class="teal" x1="600" y1="132" x2="618" y2="132"/><text class="sub" x="622" y="135">Age 15</text>
  <line class="purp" x1="668" y1="132" x2="686" y2="132"/><text class="sub" x="690" y="135">Age 50</text>
  <line x1="600" y1="148" x2="618" y2="148" stroke="#555" stroke-width="2"/><text class="sub" x="622" y="151">observed</text>
  <line x1="690" y1="148" x2="708" y2="148" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/><text class="sub" x="712" y="151">expected (constant fertility)</text>

  <!-- A feeds B and C -->
  <path class="flow" d="M905,300 C905,330 905,345 905,392" marker-end="url(#arrow)"/>
  <text class="sub" x="912" y="345">aggregate</text><text class="sub" x="912" y="357">over ages</text>

  <!-- ========================= PANEL B ========================= -->
  <rect class="panel" x="760" y="398" width="462" height="150" rx="10"/>
  <text class="ptitle" x="776" y="424">B · National estimate</text>
  <text class="sub" x="776" y="440">age-aggregated excess / deficit of births</text>
  <line class="ax" x1="800" y1="470" x2="1050" y2="470"/>
  <line class="ax" x1="800" y1="455" x2="800" y2="530"/>
  <line class="zero" x1="800" y1="498" x2="1050" y2="498"/>
  <text class="sub" x="793" y="501" text-anchor="end">0</text>
  <path d="M803,486 C850,478 890,480 930,496 C970,512 1010,520 1048,522" stroke="#222" stroke-width="2" fill="none"/>
  <text class="lab" x="925" y="545" text-anchor="middle">time</text>
  <text class="lab" x="786" y="495" text-anchor="middle" transform="rotate(-90 786 495)">excess / deficit</text>

  <!-- ========================= PANEL C ========================= -->
  <rect class="panel" x="18" y="398" width="724" height="580" rx="10"/>
  <text class="ptitle" x="34" y="424">C · Municipality-level estimate</text>
  <text class="sub" x="34" y="441">distribute national expected births (per age) to municipalities, then compute local excess/deficit</text>

  <!-- national expected-births-by-age boxes -->
  <path class="flow" d="M905,320 C905,362 300,360 168,470" marker-end="url(#arrow)"/>
  <text class="sub" x="300" y="455">expected births by age (from A)</text>
  <rect x="35" y="470" width="125" height="42" rx="6" fill="#d7f0e6" stroke="#1b9e77"/>
  <text class="sub" x="97" y="489" text-anchor="middle" fill="#145c45">Expected births</text>
  <text class="sub" x="97" y="503" text-anchor="middle" fill="#145c45">Age 15 — national</text>
  <rect x="35" y="575" width="125" height="42" rx="6" fill="#e4e1f2" stroke="#7570b3"/>
  <text class="sub" x="97" y="594" text-anchor="middle" fill="#403a73">Expected births</text>
  <text class="sub" x="97" y="608" text-anchor="middle" fill="#403a73">Age 50 — national</text>

  <text class="sub" x="285" y="452" text-anchor="middle">× age-specific population share</text>
  <!-- Age 15 rows -->
  <rect x="205" y="456" width="165" height="24" rx="4" fill="#d7f0e6" stroke="#1b9e77"/><text class="sub" x="287" y="472" text-anchor="middle" fill="#145c45">Age 15 &#8594; Municipality 1</text>
  <rect x="205" y="486" width="165" height="24" rx="4" fill="#eaf6f1" stroke="#9ed4c0"/><text class="sub" x="287" y="502" text-anchor="middle" fill="#6a9d8a">Age 15 &#8594; Municipality 2</text>
  <text class="dots" x="287" y="524" text-anchor="middle">&#8942;</text>
  <rect x="205" y="528" width="165" height="24" rx="4" fill="#eaf6f1" stroke="#9ed4c0"/><text class="sub" x="287" y="544" text-anchor="middle" fill="#6a9d8a">Age 15 &#8594; Municipality 2107</text>
  <!-- separator between age groups -->
  <text class="dots" x="287" y="572" text-anchor="middle">&#8942;</text>
  <!-- Age 50 rows -->
  <rect x="205" y="578" width="165" height="24" rx="4" fill="#e4e1f2" stroke="#7570b3"/><text class="sub" x="287" y="594" text-anchor="middle" fill="#403a73">Age 50 &#8594; Municipality 1</text>
  <rect x="205" y="608" width="165" height="24" rx="4" fill="#efedf7" stroke="#b7b2d6"/><text class="sub" x="287" y="624" text-anchor="middle" fill="#7d78a6">Age 50 &#8594; Municipality 2</text>
  <text class="dots" x="287" y="646" text-anchor="middle">&#8942;</text>
  <rect x="205" y="650" width="165" height="24" rx="4" fill="#efedf7" stroke="#b7b2d6"/><text class="sub" x="287" y="666" text-anchor="middle" fill="#7d78a6">Age 50 &#8594; Municipality 2107</text>

  <!-- distribution arrows -->
  <g class="flow" stroke="#1b9e77">
    <path d="M161,484 C180,476 188,470 203,468" marker-end="url(#arrow)"/>
    <path d="M161,490 C180,496 188,498 203,498" marker-end="url(#arrow)"/>
    <path d="M161,496 C180,530 188,540 203,540" marker-end="url(#arrow)"/>
  </g>
  <g class="flow" stroke="#7570b3">
    <path d="M161,589 C180,592 188,590 203,590" marker-end="url(#arrow)"/>
    <path d="M161,595 C180,614 188,620 203,620" marker-end="url(#arrow)"/>
    <path d="M161,601 C180,655 188,662 203,662" marker-end="url(#arrow)"/>
  </g>

  <!-- Municipality 1: box 1 (Age15 Mun1) and box 4 (Age50 Mun1) -> Births box -->
  <path class="flow" d="M371,468 C400,468 405,495 420,512" marker-end="url(#arrow)"/>
  <path class="flow" d="M371,590 C400,590 405,545 420,528" marker-end="url(#arrow)"/>
  <rect x="422" y="470" width="200" height="105" rx="8" fill="#fff" stroke="#c7d2e0"/>
  <text class="sub" x="522" y="489" text-anchor="middle" font-weight="bold">Births: Municipality 1</text>
  <line class="ax" x1="442" y1="560" x2="602" y2="560"/>
  <line class="ax" x1="442" y1="505" x2="442" y2="560"/>
  <path d="M444,552 C472,544 478,518 518,518 C562,518 578,548 600,550" stroke="#222" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <path d="M444,554 C472,546 497,532 532,540 C567,548 582,551 600,553" stroke="#222" stroke-width="1.6" fill="none"/>
  <text class="lab" x="522" y="572" text-anchor="middle">time</text>

  <!-- -> excess/deficit Municipality 1 -->
  <path class="flow" d="M522,576 C522,610 522,625 522,660" marker-end="url(#arrow)"/>
  <rect x="415" y="665" width="215" height="130" rx="8" fill="#fff" stroke="#c7d2e0"/>
  <text class="sub" x="522" y="684" text-anchor="middle" font-weight="bold">Excess / deficit — Municipality 1</text>
  <text class="sub" x="522" y="697" text-anchor="middle">observed &#8722; expected</text>
  <line class="ax" x1="448" y1="770" x2="608" y2="770"/>
  <line class="ax" x1="448" y1="717" x2="448" y2="777"/>
  <line class="zero" x1="448" y1="750" x2="608" y2="750"/>
  <text class="sub" x="441" y="753" text-anchor="end">0</text>
  <path d="M450,742 C488,736 523,740 558,754 C588,766 603,771 606,772" stroke="#222" stroke-width="1.6" fill="none"/>
  <text class="lab" x="522" y="790" text-anchor="middle">time</text>

  <!-- repeat note -->
  <text class="sub" x="287" y="712" text-anchor="middle" fill="#888" font-style="italic">&#8942; same for each municipality</text>
  <text class="sub" x="287" y="727" text-anchor="middle" fill="#888" font-style="italic">(and district, citizenship, parity)</text>

  <!-- bottom banner -->
  <rect x="18" y="940" width="1204" height="44" rx="8" fill="#eef3f9" stroke="#c7d2e0"/>
  <text x="620" y="959" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">Fertility is estimated once nationally; spatial and subgroup variation comes from applying that common schedule to local population by age —</text>
  <text x="620" y="976" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">no spatially-varying fertility model is fitted.</text>
</svg>
