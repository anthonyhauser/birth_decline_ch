<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#f7f9fc;stroke:#c7d2e0;stroke-width:1.5;rx:10;}
      .step{font-size:15px;font-weight:bold;fill:#1a3b5d;}
      .cap{font-size:11.5px;fill:#333;}
      .sub{font-size:10.5px;fill:#555;}
      .eq{font-size:11px;fill:#444;font-style:italic;}
      .axis{stroke:#999;stroke-width:1;}
      .obs{stroke:#b22222;stroke-width:2;fill:none;}
      .exp{stroke:#222;stroke-width:2;fill:none;}
      .f{stroke:#1a7a1a;stroke-width:2;fill:none;}
    </style>
  </defs>

  <!-- title -->
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#1a3b5d">Estimating the excess/deficit of births: national model, then distribution to sub-populations</text>

  <!-- ============ STEP 1 ============ -->
  <rect class="box" x="20" y="50" width="270" height="340" rx="10"/>
  <text class="step" x="35" y="76">1 · National model</text>
  <text class="cap" x="35" y="98">Monthly births by single age,</text>
  <text class="cap" x="35" y="114">Switzerland, 2000–2025.</text>
  <!-- fertility curve sketch -->
  <line class="axis" x1="45" y1="210" x2="265" y2="210"/>
  <line class="axis" x1="45" y1="140" x2="45" y2="210"/>
  <path class="f" d="M50,208 C110,205 120,150 155,150 C190,150 205,205 260,208"/>
  <text class="sub" x="150" y="226" text-anchor="middle">fertility by age  f(a)</text>
  <!-- equation -->
  <text class="eq" x="35" y="262">y_a(t) ~ NegBin(μ, φ)</text>
  <text class="eq" x="35" y="282">log μ = f(a+δ(t)) + γ_m + γ_y</text>
  <text class="eq" x="35" y="300">        + log N_a(t)</text>
  <text class="sub" x="35" y="326">δ(t): shift in timing of fertility</text>
  <text class="sub" x="35" y="342">γ_m, γ_y: month, year effects</text>
  <text class="sub" x="35" y="358">N_a(t): women aged a (offset)</text>
  <text class="sub" x="35" y="378" font-style="italic">fitted once, nationally</text>

  <!-- ============ STEP 2 ============ -->
  <rect class="box" x="315" y="50" width="270" height="340" rx="10"/>
  <text class="step" x="330" y="76">2 · Expected births</text>
  <text class="cap" x="330" y="98">Counterfactual: fertility</text>
  <text class="cap" x="330" y="114">level held constant over time</text>
  <text class="cap" x="330" y="130">(only age structure &amp; timing vary).</text>
  <!-- obs vs exp sketch -->
  <line class="axis" x1="340" y1="300" x2="560" y2="300"/>
  <line class="axis" x1="340" y1="170" x2="340" y2="300"/>
  <path class="exp" d="M345,250 C400,232 470,225 555,228"/>
  <path class="obs" d="M345,252 C410,232 455,250 500,275 C525,288 540,290 555,292"/>
  <text class="sub" x="565" y="230" fill="#222" text-anchor="end">expected</text>
  <text class="sub" x="565" y="286" fill="#b22222" text-anchor="end">observed</text>
  <text class="sub" x="330" y="330">Excess / deficit =</text>
  <text class="sub" x="330" y="346">observed − expected</text>
  <text class="sub" x="330" y="372" font-style="italic">obtained at the national level</text>

  <!-- ============ STEP 3 ============ -->
  <rect class="box" x="610" y="50" width="270" height="340" rx="10"/>
  <text class="step" x="625" y="76">3 · Distribute (downscale)</text>
  <text class="cap" x="625" y="98">Allocate national expected</text>
  <text class="cap" x="625" y="114">births to sub-populations in</text>
  <text class="cap" x="625" y="130">proportion to their population</text>
  <text class="cap" x="625" y="146">by age (multinomial).</text>
  <!-- splitting sketch -->
  <circle cx="660" cy="250" r="22" fill="#1a3b5d" opacity="0.85"/>
  <text x="660" y="254" font-size="10" fill="#fff" text-anchor="middle">nat.</text>
  <g fill="#4a7ab5" opacity="0.9">
    <circle cx="770" cy="200" r="9"/><circle cx="800" cy="220" r="12"/>
    <circle cx="780" cy="250" r="7"/><circle cx="815" cy="258" r="10"/>
    <circle cx="770" cy="288" r="13"/><circle cx="808" cy="292" r="8"/>
  </g>
  <g stroke="#9bb3cf" stroke-width="1.2">
    <line x1="682" y1="244" x2="762" y2="202" marker-end="url(#arrow)"/>
    <line x1="684" y1="248" x2="790" y2="218" marker-end="url(#arrow)"/>
    <line x1="684" y1="254" x2="774" y2="248" marker-end="url(#arrow)"/>
    <line x1="684" y1="256" x2="806" y2="256" marker-end="url(#arrow)"/>
    <line x1="682" y1="262" x2="760" y2="284" marker-end="url(#arrow)"/>
  </g>
  <text class="sub" x="625" y="330">municipalities, districts,</text>
  <text class="sub" x="625" y="346">citizenship, parity</text>
  <text class="sub" x="625" y="372" font-style="italic">no spatial model fitted</text>

  <!-- ============ STEP 4 ============ -->
  <rect class="box" x="905" y="50" width="255" height="340" rx="10"/>
  <text class="step" x="920" y="76">4 · Local excess/deficit</text>
  <text class="cap" x="920" y="98">Observed − expected at each</text>
  <text class="cap" x="920" y="114">level → relative excess/deficit.</text>
  <!-- mini map grid -->
  <g stroke="#fff" stroke-width="1">
    <rect x="930" y="150" width="26" height="26" fill="#2a9d3a"/><rect x="956" y="150" width="26" height="26" fill="#8ccf6f"/><rect x="982" y="150" width="26" height="26" fill="#f4e04d"/><rect x="1008" y="150" width="26" height="26" fill="#ef8a3a"/>
    <rect x="930" y="176" width="26" height="26" fill="#8ccf6f"/><rect x="956" y="176" width="26" height="26" fill="#f4e04d"/><rect x="982" y="176" width="26" height="26" fill="#ef8a3a"/><rect x="1008" y="176" width="26" height="26" fill="#d6453d"/>
    <rect x="930" y="202" width="26" height="26" fill="#f4e04d"/><rect x="956" y="202" width="26" height="26" fill="#ef8a3a"/><rect x="982" y="202" width="26" height="26" fill="#d6453d"/><rect x="1008" y="202" width="26" height="26" fill="#b22222"/>
  </g>
  <text class="sub" x="920" y="250">mapped, smoothed over</text>
  <text class="sub" x="920" y="266">neighbouring municipalities</text>
  <!-- decile bars -->
  <g fill="#4a7ab5">
    <rect x="930" y="330" width="12" height="14" /><rect x="946" y="325" width="12" height="19"/><rect x="962" y="318" width="12" height="26"/><rect x="978" y="322" width="12" height="22"/><rect x="994" y="312" width="12" height="32"/><rect x="1010" y="305" width="12" height="39"/>
  </g>
  <line class="axis" x1="928" y1="344" x2="1030" y2="344"/>
  <text class="sub" x="920" y="368">stratified by covariate deciles</text>

  <!-- arrows between steps -->
  <g stroke="#555" stroke-width="2">
    <line x1="291" y1="220" x2="313" y2="220" marker-end="url(#arrow)"/>
    <line x1="586" y1="220" x2="608" y2="220" marker-end="url(#arrow)"/>
    <line x1="881" y1="220" x2="903" y2="220" marker-end="url(#arrow)"/>
  </g>

  <!-- bottom banner -->
  <rect x="20" y="410" width="1140" height="44" rx="8" fill="#eef3f9" stroke="#c7d2e0"/>
  <text x="590" y="430" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">Spatial and subgroup variation arises from local population composition applied to a single national fertility schedule —</text>
  <text x="590" y="447" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">fertility itself is not modelled spatially.</text>
</svg>
