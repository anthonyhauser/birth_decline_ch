<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .panel{fill:#fbfcfe;stroke:#c7d2e0;stroke-width:1.5;}
      .ptitle{font-size:15px;font-weight:bold;fill:#1a3b5d;}
      .ax{stroke:#999;stroke-width:1;}
      .lab{font-size:11px;fill:#444;}
      .sub{font-size:10px;fill:#666;}
      .teal{stroke:#1b9e77;fill:none;stroke-width:2;}
      .purp{stroke:#7570b3;fill:none;stroke-width:2;}
      .blue{stroke:#2c7fb8;fill:none;stroke-width:2;}
      .orng{stroke:#e6550d;fill:none;stroke-width:2;}
      .exp{stroke-dasharray:5 3;}
      .flow{stroke:#555;stroke-width:2;fill:none;}
      .zero{stroke:#888;stroke-width:1;stroke-dasharray:4 3;}
    </style>
  </defs>

  <!-- ========================= PANEL A ========================= -->
  <rect class="panel" x="18" y="40" width="1204" height="330" rx="10"/>
  <text class="ptitle" x="34" y="66">A · Model calibration (national level)</text>

  <!-- A1: fertility by age, 2000 vs 2025 -->
  <text class="sub" x="150" y="88" text-anchor="middle">fertility by age</text>
  <line class="ax" x1="80" y1="195" x2="300" y2="195"/>
  <line class="ax" x1="80" y1="100" x2="80" y2="195"/>
  <path class="blue" d="M83,193 C120,190 135,112 158,112 C181,112 196,190 297,193"/>
  <path class="orng" d="M83,194 C128,192 160,138 183,138 C206,138 220,191 297,194"/>
  <text class="lab" x="190" y="212" text-anchor="middle">age</text>
  <text class="lab" x="66" y="150" text-anchor="middle" transform="rotate(-90 66 150)">fertility</text>
  <line class="blue" x1="235" y1="104" x2="251" y2="104"/><text class="sub" x="255" y="107">2000</text>
  <line class="orng" x1="235" y1="118" x2="251" y2="118"/><text class="sub" x="255" y="121">2025</text>

  <!-- A2: population by age over time -->
  <text class="sub" x="150" y="238" text-anchor="middle">population by age, over time</text>
  <line class="ax" x1="80" y1="340" x2="300" y2="340"/>
  <line class="ax" x1="80" y1="250" x2="80" y2="340"/>
  <path d="M83,300 C150,292 230,286 297,282" stroke="#555" fill="none" stroke-width="1.6"/>
  <path d="M83,318 C150,314 230,312 297,306" stroke="#999" fill="none" stroke-width="1.6"/>
  <path d="M83,330 C150,331 230,329 297,326" stroke="#bbb" fill="none" stroke-width="1.6"/>
  <text class="lab" x="190" y="357" text-anchor="middle">time</text>
  <text class="lab" x="66" y="295" text-anchor="middle" transform="rotate(-90 66 295)">population</text>

  <!-- merge arrows into model -->
  <path class="flow" d="M303,150 C360,160 380,205 430,212" marker-end="url(#arrow)"/>
  <path class="flow" d="M303,295 C360,285 380,228 430,218" marker-end="url(#arrow)"/>
  <rect x="432" y="196" width="96" height="40" rx="6" fill="#eef3f9" stroke="#c7d2e0"/>
  <text class="sub" x="480" y="213" text-anchor="middle">negative-binomial</text>
  <text class="sub" x="480" y="227" text-anchor="middle">model</text>
  <path class="flow" d="M530,216 C545,216 548,216 560,216" marker-end="url(#arrow)"/>

  <!-- A3: births over time for two ages, observed (solid) vs expected (dashed) -->
  <text class="sub" x="710" y="110" text-anchor="middle">number of births over time (two ages)</text>
  <line class="ax" x1="585" y1="300" x2="855" y2="300"/>
  <line class="ax" x1="585" y1="130" x2="585" y2="300"/>
  <path class="teal"          d="M588,275 C640,256 690,250 740,256 C790,262 825,270 852,272"/>
  <path class="teal exp"      d="M588,270 C640,250 700,244 752,244 C800,244 828,246 852,248"/>
  <path class="purp"          d="M588,230 C645,216 695,214 745,226 C795,238 825,244 852,246"/>
  <path class="purp exp"      d="M588,226 C650,212 705,208 760,210 C805,212 828,214 852,216"/>
  <text class="lab" x="720" y="318" text-anchor="middle">time</text>
  <text class="lab" x="571" y="215" text-anchor="middle" transform="rotate(-90 571 215)">births</text>
  <!-- legend -->
  <line class="teal" x1="600" y1="132" x2="618" y2="132"/><text class="sub" x="622" y="135">age a</text>
  <line class="purp" x1="665" y1="132" x2="683" y2="132"/><text class="sub" x="687" y="135">age b</text>
  <line x1="600" y1="148" x2="618" y2="148" stroke="#555" stroke-width="2"/><text class="sub" x="622" y="151">observed</text>
  <line x1="690" y1="148" x2="708" y2="148" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/><text class="sub" x="712" y="151">expected (constant fertility)</text>

  <!-- A3 feeds B and C -->
  <path class="flow" d="M905,300 C905,330 905,345 905,392" marker-end="url(#arrow)"/>   <!-- to B region (down) -->
  <text class="sub" x="912" y="345">aggregate</text><text class="sub" x="912" y="357">over ages</text>

  <!-- ========================= PANEL B ========================= -->
  <rect class="panel" x="760" y="398" width="462" height="150" rx="10"/>
  <text class="ptitle" x="776" y="424">B · National estimate</text>
  <text class="sub" x="776" y="440">age-aggregated excess / deficit of births</text>
  <line class="ax" x1="800" y1="470" x2="1050" y2="470"/>
  <line class="ax" x1="800" y1="455" x2="800" y2="530"/>
  <line class="zero" x1="800" y1="498" x2="1050" y2="498"/>
  <text class="sub" x="793" y="501" text-anchor="end">0</text>
  <path d="M803,486 C850,478 890,480 930,496 C970,512 1010,520 1048,522" stroke="#222" stroke-width="2" fill="none"/>
  <text class="lab" x="925" y="545" text-anchor="middle">time</text>
  <text class="lab" x="786" y="495" text-anchor="middle" transform="rotate(-90 786 495)">excess / deficit</text>

  <!-- ========================= PANEL C ========================= -->
  <rect class="panel" x="18" y="398" width="724" height="580" rx="10"/>
  <text class="ptitle" x="34" y="424">C · Municipality-level estimate</text>
  <text class="sub" x="34" y="441">distribute national expected births (per age) to municipalities, then compute local excess/deficit</text>

  <!-- national expected-births-by-age boxes (from A) -->
  <path class="flow" d="M905,320 C905,360 560,360 470,470" marker-end="url(#arrow)"/>
  <text class="sub" x="470" y="455">expected births by age (from A)</text>
  <rect x="40" y="475" width="150" height="46" rx="6" fill="#d7f0e6" stroke="#1b9e77"/>
  <text class="sub" x="115" y="494" text-anchor="middle" fill="#145c45">Expected births</text>
  <text class="sub" x="115" y="508" text-anchor="middle" fill="#145c45">age a — national</text>
  <rect x="40" y="560" width="150" height="46" rx="6" fill="#e4e1f2" stroke="#7570b3"/>
  <text class="sub" x="115" y="579" text-anchor="middle" fill="#403a73">Expected births</text>
  <text class="sub" x="115" y="593" text-anchor="middle" fill="#403a73">age b — national</text>

  <!-- 3 municipalities x 2 ages grid -->
  <text class="sub" x="300" y="462" text-anchor="middle">× age-specific population share</text>
  <!-- column cells: age a (teal), age b (purple), rows M1,M2,M3 -->
  <!-- row labels -->
  <text class="sub" x="300" y="502" text-anchor="middle" font-weight="bold">Municipality 1</text>
  <text class="sub" x="300" y="560" text-anchor="middle">Municipality 2</text>
  <text class="sub" x="300" y="600" text-anchor="middle">Municipality 3</text>
  <!-- M1 cells -->
  <rect x="345" y="488" width="40" height="26" rx="4" fill="#d7f0e6" stroke="#1b9e77"/><text class="sub" x="365" y="505" text-anchor="middle">a</text>
  <rect x="390" y="488" width="40" height="26" rx="4" fill="#e4e1f2" stroke="#7570b3"/><text class="sub" x="410" y="505" text-anchor="middle">b</text>
  <!-- M2 cells (faded) -->
  <rect x="345" y="545" width="40" height="22" rx="4" fill="#eaf6f1" stroke="#9ed4c0"/><text class="sub" x="365" y="560" text-anchor="middle" fill="#888">a</text>
  <rect x="390" y="545" width="40" height="22" rx="4" fill="#efedf7" stroke="#b7b2d6"/><text class="sub" x="410" y="560" text-anchor="middle" fill="#888">b</text>
  <!-- M3 cells (faded) -->
  <rect x="345" y="588" width="40" height="22" rx="4" fill="#eaf6f1" stroke="#9ed4c0"/><text class="sub" x="365" y="603" text-anchor="middle" fill="#888">a</text>
  <rect x="390" y="588" width="40" height="22" rx="4" fill="#efedf7" stroke="#b7b2d6"/><text class="sub" x="410" y="603" text-anchor="middle" fill="#888">b</text>

  <!-- distribution arrows: age a box -> a cells ; age b box -> b cells -->
  <g class="flow" stroke="#1b9e77">
    <path d="M191,495 C260,495 290,498 343,501" marker-end="url(#arrow)"/>
    <path d="M191,500 C260,520 290,552 343,556" marker-end="url(#arrow)"/>
    <path d="M191,505 C260,560 300,596 343,599" marker-end="url(#arrow)"/>
  </g>
  <g class="flow" stroke="#7570b3">
    <path d="M191,583 C280,560 320,512 388,503" marker-end="url(#arrow)"/>
    <path d="M191,585 C290,575 330,558 388,557" marker-end="url(#arrow)"/>
    <path d="M191,590 C300,600 340,600 388,600" marker-end="url(#arrow)"/>
  </g>

  <!-- municipality 1: combine two ages -> expected births line -->
  <path class="flow" d="M432,501 C470,501 475,520 500,545" marker-end="url(#arrow)"/>
  <path class="flow" d="M432,505 C470,520 475,545 500,558" marker-end="url(#arrow)"/>
  <rect x="505" y="500" width="215" height="120" rx="8" fill="#fff" stroke="#c7d2e0"/>
  <text class="sub" x="612" y="518" text-anchor="middle" font-weight="bold">Expected births — municipality 1</text>
  <text class="sub" x="612" y="531" text-anchor="middle">(sum over ages, over time)</text>
  <line class="ax" x1="525" y1="605" x2="705" y2="605"/>
  <line class="ax" x1="525" y1="545" x2="525" y2="605"/>
  <path d="M527,598 C560,588 560,560 600,560 C650,560 660,590 703,593" stroke="#222" stroke-width="1.8" fill="none" stroke-dasharray="5 3"/>
  <path d="M527,600 C560,592 580,575 620,582 C660,589 680,595 703,597" stroke="#222" stroke-width="1.8" fill="none"/>
  <text class="sub" x="612" y="617" text-anchor="middle" fill="#888">— observed   -- expected</text>

  <!-- -> excess/deficit for municipality 1 -->
  <path class="flow" d="M612,624 C612,650 612,662 612,690" marker-end="url(#arrow)"/>
  <rect x="470" y="695" width="285" height="130" rx="8" fill="#fff" stroke="#c7d2e0"/>
  <text class="sub" x="612" y="714" text-anchor="middle" font-weight="bold">Excess / deficit — municipality 1</text>
  <text class="sub" x="612" y="727" text-anchor="middle">observed − expected</text>
  <line class="ax" x1="500" y1="790" x2="725" y2="790"/>
  <line class="ax" x1="500" y1="740" x2="500" y2="800"/>
  <line class="zero" x1="500" y1="772" x2="725" y2="772"/>
  <text class="sub" x="493" y="775" text-anchor="end">0</text>
  <path d="M503,764 C545,758 585,762 625,776 C665,790 700,795 723,796" stroke="#222" stroke-width="1.8" fill="none"/>
  <text class="lab" x="612" y="812" text-anchor="middle">time</text>

  <!-- repeat note -->
  <text class="sub" x="300" y="645" text-anchor="middle" fill="#888" font-style="italic">⋮ same for each municipality (and district, citizenship, parity)</text>

  <!-- bottom banner -->
  <rect x="18" y="940" width="1204" height="44" rx="8" fill="#eef3f9" stroke="#c7d2e0"/>
  <text x="620" y="959" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">Fertility is estimated once nationally; spatial and subgroup variation comes from applying that common schedule to local population by age —</text>
  <text x="620" y="976" font-size="12.5" font-weight="bold" fill="#1a3b5d" text-anchor="middle">no spatially-varying fertility model is fitted.</text>
</svg>
